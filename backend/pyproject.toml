# SINGLE SOURCE OF TRUTH FOR DEPENDENCIES: requirements-prod.txt
#
# This file used to declare its own version constraints, and every one of them
# was contradicted by what production actually installs:
#
#     declared here          production runs
#     numpy   ^1.26.0  (<2)  numpy   2.2.6
#     pandas  ^2.2.0   (<3)  pandas  3.0.2
#     smartmoneyconcepts ^0.0.22 (poetry caret on 0.0.x means <0.0.23)
#                            smartmoneyconcepts 0.0.27
#     pandas-ta >=0.3.14b (unpinned, now needs numpy>=2.2.6)
#
# The last of those made `pip install -e .` fail outright — pandas-ta demanded
# numpy>=2.2.6 while this file demanded numpy<2.0.0, an unsatisfiable pair. So
# the documented setup command did not work, and the constraints described a
# system nobody was running.
#
# Rather than hand-maintain a second list that drifts again, dependencies are
# now read FROM requirements-prod.txt via setuptools' dynamic metadata. There is
# exactly one place where a version is written down, and the VPS compose installs
# from that same file. Changing a version anywhere changes it everywhere.
#
#   pip install -e .            production runtime set
#   pip install -e ".[dev]"     + test tooling (what CI installs)

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingai-backend"
version = "0.1.0"
description = "Trading AI Co-Pilot Backend"
requires-python = ">=3.12"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements-prod.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = ["requirements-dev.txt"] }

[tool.setuptools.packages.find]
# Ship only the application package. alembic/, tests/ and scripts/ are repo
# tooling, not library code.
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: marks tests as integration (need docker services)",
  "slow: marks tests as slow (>5s)"
]
testpaths = ["tests"]
