# THE ACTUAL VPS DEPLOYMENT — Hostinger 31.97.183.142, compose project "tradingai".
#
# ------------------------------------------------------------------------------
# KEEP THIS IDENTICAL TO /docker/tradingai/docker-compose.yml ON THE VPS, except
# for API_AUTH_TOKEN. This is not a template or an example — it is the record of
# what runs.
# ------------------------------------------------------------------------------
#
# The previous version of this file described a completely different deployment:
# Docker git build-contexts (`build: context: https://github.com/...`), a plain
# `alembic upgrade head`, and no API_AUTH_TOKEN at all. That is not how this
# deploys. Hostinger runs `docker compose up` WITHOUT `--build`, so build
# contexts fail outright. The real deployment is a RUNTIME CLONE: stock
# python/node images that `git clone` the repo at container start. Anyone
# trusting the old file would have deployed nothing and wondered why.
#
# WHY THE INLINE PIP LIST IS GONE
# The api service used to carry ~20 inline `pkg==version` pins in its command
# block. That was a copy of the dependency list living only on the VPS —
# invisible to the repo and to CI. It is how production came to run numpy 2.2.6
# while pyproject.toml declared numpy<2.0.0, with the suite never once run
# against what actually ships. It now installs from backend/requirements-prod.txt,
# the same file pyproject.toml and CI read. One list, three consumers.
# .github/workflows/ci.yml fails the build if inline pins reappear here.
#
# THE DEPLOY GOTCHA (unchanged)
# Both app containers guard setup with `if [ ! -f /app/.ready ]`, so a plain
# `docker compose restart` KEEPS THE OLD CODE. To ship new code:
#     docker compose up -d --force-recreate api web
# Downtime ~3-5 min while pip/pnpm reinstall.
#
# KNOWN, NOT FIXED HERE (deliberate — separate tasks, each needs its own testing):
#   * `pnpm dev` serves the frontend in production. That is the Vite DEV server:
#     unminified, source maps exposed, HMR websocket open. Should be a built
#     bundle behind a static server.
#
# WHICH COMMIT IS RUNNING (was KNOWN_ISSUES B3)
# Both services now fetch an explicit `GIT_REF` and write the resolved SHA to
# /app/.build-sha; the api serves it at /api/system/version. Read that endpoint
# rather than inferring a version from deploy timestamps.
#
# Note what this does and does not fix. GIT_REF still defaults to `main`, so the
# deploy is IDENTIFIABLE but not yet REPRODUCIBLE — recreate a container tomorrow
# and you get a different commit, correctly reported. The endpoint says
# `pinned: false` when that is the case, deliberately, so the distinction is
# visible instead of assumed. Set GIT_REF to a full SHA to make a release
# reproducible.

name: tradingai

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: tradingai
      POSTGRES_USER: tradingai
      POSTGRES_PASSWORD: tradingai
    volumes:
      - tradingai_db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingai -d tradingai"]
      interval: 5s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    image: python:3.12-slim
    working_dir: /app
    environment:
      DATABASE_URL: "postgresql+asyncpg://tradingai:tradingai@db:5432/tradingai"
      REDIS_URL: "redis://redis:6379/0"
      DATA_DIR: "/tmp/tradingai-data"
      # Read-only views of the two things that fail silently, so /api/system/
      # data-health can actually see them. Read-only is deliberate: the api must
      # never be able to corrupt the collector's unrecoverable data or the
      # backups it reports on.
      DOMINANCE_DATA_DIR: "/data/dominance"
      BACKUP_STATUS_DIR: "/data/backups"
      PYTHONPATH: "/app"
      # SECRET — the real value lives ONLY in the VPS copy of this file and is
      # deliberately not committed. Set it there; never here.
      API_AUTH_TOKEN: "__SET_ON_VPS_ONLY__"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # WHAT CODE TO RUN. A branch name is convenient and NOT reproducible:
      # recreate the container tomorrow and you get different code. Put a full
      # 40-character commit SHA here to pin a release — /api/system/version then
      # reports pinned:true, and rolling back is editing this one line.
      GIT_REF: "main"
      # ENGINE_BROKER: "sim"   # uncomment to run the prop-firm challenge sim
      #                        # (the Tier 2 vehicle). Unset = "paper".
    volumes:
      - /opt/dominance:/data/dominance:ro
      - /home/deploy/tradingai-backups:/data/backups:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        apt-get update -qq
        apt-get install -y --no-install-recommends git ca-certificates >/dev/null
        if [ ! -f /app/.ready ]; then
          rm -rf /tmp/src
          # fetch-by-ref rather than `clone --depth 1`: this accepts a branch, a
          # tag, OR a full commit SHA with the same three commands, so pinning a
          # release is a value change and not a rewrite. `clone --branch` cannot
          # take a SHA, which is why the old form could only ever float.
          git init -q /tmp/src
          git -C /tmp/src remote add origin https://github.com/Amineregayeg/tradingai.git
          git -C /tmp/src fetch -q --depth 1 origin "$${GIT_REF:-main}"
          git -C /tmp/src checkout -q FETCH_HEAD
          cp -a /tmp/src/backend/. /app/
          # Record what was ACTUALLY checked out, not what was asked for. Asking
          # for "main" and never recording which commit that resolved to is the
          # entire defect (KNOWN_ISSUES B3) — /api/system/version reads this file.
          git -C /tmp/src rev-parse HEAD > /app/.build-sha
          # SINGLE SOURCE OF TRUTH for versions. Do not inline pins here again.
          pip install --no-cache-dir -r /app/requirements-prod.txt
          touch /app/.ready
        fi
        python deploy_migrate.py
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: node:20-slim
    working_dir: /app
    environment:
      VITE_API_TARGET: "http://api:8000"
      # Keep in step with the api's GIT_REF. Recreating one container and not the
      # other is how the two halves end up on different commits — the specific
      # thing B3 says nobody could detect.
      GIT_REF: "main"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        apt-get update -qq
        apt-get install -y --no-install-recommends git ca-certificates >/dev/null
        if [ ! -f /app/.ready ]; then
          rm -rf /tmp/src
          git init -q /tmp/src
          git -C /tmp/src remote add origin https://github.com/Amineregayeg/tradingai.git
          git -C /tmp/src fetch -q --depth 1 origin "$${GIT_REF:-main}"
          git -C /tmp/src checkout -q FETCH_HEAD
          cp -a /tmp/src/frontend/. /app/
          # Nothing serves this one — the frontend has no endpoint. It is written
          # so `docker exec tradingai-web-1 cat /app/.build-sha` can answer
          # "is web on the same commit as api?", which is otherwise unanswerable.
          git -C /tmp/src rev-parse HEAD > /app/.build-sha
          corepack enable
          corepack prepare pnpm@9 --activate
          # --frozen-lockfile (was --no-frozen-lockfile): the committed
          # pnpm-lock.yaml is the source of truth for frontend versions. The old
          # flag let production silently resolve packages CI never tested — the
          # same drift the backend had. Verified to install cleanly against the
          # committed lockfile.
          pnpm install --frozen-lockfile
          touch /app/.ready
        fi
        corepack enable
        corepack prepare pnpm@9 --activate
        exec pnpm dev --host 0.0.0.0 --port 5173
    ports:
      - "8095:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  tradingai_db:
