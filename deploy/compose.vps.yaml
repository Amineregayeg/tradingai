# THE ACTUAL VPS DEPLOYMENT — Hostinger 31.97.183.142, compose project "tradingai".
#
# ------------------------------------------------------------------------------
# KEEP THIS IDENTICAL TO /docker/tradingai/docker-compose.yml ON THE VPS, except
# for API_AUTH_TOKEN. This is not a template or an example — it is the record of
# what runs.
# ------------------------------------------------------------------------------
#
# The previous version of this file described a completely different deployment:
# Docker git build-contexts (`build: context: https://github.com/...`), a plain
# `alembic upgrade head`, and no API_AUTH_TOKEN at all. That is not how this
# deploys. Hostinger runs `docker compose up` WITHOUT `--build`, so build
# contexts fail outright. The real deployment is a RUNTIME CLONE: stock
# python/node images that `git clone` the repo at container start. Anyone
# trusting the old file would have deployed nothing and wondered why.
#
# WHY THE INLINE PIP LIST IS GONE
# The api service used to carry ~20 inline `pkg==version` pins in its command
# block. That was a copy of the dependency list living only on the VPS —
# invisible to the repo and to CI. It is how production came to run numpy 2.2.6
# while pyproject.toml declared numpy<2.0.0, with the suite never once run
# against what actually ships. It now installs from backend/requirements-prod.txt,
# the same file pyproject.toml and CI read. One list, three consumers.
# .github/workflows/ci.yml fails the build if inline pins reappear here.
#
# THE DEPLOY GOTCHA
# The api guards setup with `if [ ! -f /app/.ready ]`, so a plain
# `docker compose restart` KEEPS THE OLD CODE. To ship new code:
#     docker compose up -d --force-recreate api web-build web
# Downtime ~3-5 min while pip/pnpm reinstall.
#
# `web-build` is different: it keys on the commit, not a marker file, so it
# rebuilds exactly when the code changed and no-ops in seconds otherwise. It is
# a one-shot container and EXITING IS ITS SUCCESS — `docker compose ps` showing
# it as Exited (0) is the healthy state, not a crash.
#
# HOW THE FRONTEND IS SERVED (was KNOWN_ISSUES D4)
# `pnpm dev` used to serve the real site — the Vite DEV server, unminified with
# source maps exposed and an HMR websocket open. It is now a built bundle behind
# nginx (deploy/nginx-web.conf). nginx has to reproduce three things the dev
# server did implicitly: proxy /api, UPGRADE /ws to a websocket, and fall back to
# index.html for client-side routes. Each fails silently if missed.
#
# RELEASES AND ROLLBACK (was KNOWN_ISSUES D8)
# Each build lands in /srv/rel-<sha> inside the web_html volume and goes live by
# renaming the /srv/current symlink, which the kernel does atomically. Two
# consequences worth knowing:
#   * A FAILED BUILD CHANGES NOTHING. nginx keeps serving the previous release;
#     the failure shows up as web-build exiting non-zero, not as an outage.
#   * ROLLBACK IS ONE COMMAND, no rebuild:
#       docker compose run --rm -T web-build sh -c \
#         'ln -sfn rel-<older-sha> /srv/.next && mv -Tf /srv/.next /srv/current'
#     The three most recent releases are kept. `ls -1dt /srv/rel-*` lists them.
#
# WHICH COMMIT IS RUNNING (was KNOWN_ISSUES B3)
# Both services now fetch an explicit `GIT_REF` and write the resolved SHA to
# /app/.build-sha; the api serves it at /api/system/version. Read that endpoint
# rather than inferring a version from deploy timestamps.
#
# Note what this does and does not fix. GIT_REF still defaults to `main`, so the
# deploy is IDENTIFIABLE but not yet REPRODUCIBLE — recreate a container tomorrow
# and you get a different commit, correctly reported. The endpoint says
# `pinned: false` when that is the case, deliberately, so the distinction is
# visible instead of assumed. Set GIT_REF to a full SHA to make a release
# reproducible.

name: tradingai

services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: tradingai
      POSTGRES_USER: tradingai
      POSTGRES_PASSWORD: tradingai
    volumes:
      - tradingai_db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradingai -d tradingai"]
      interval: 5s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    image: python:3.12-slim
    working_dir: /app
    environment:
      DATABASE_URL: "postgresql+asyncpg://tradingai:tradingai@db:5432/tradingai"
      REDIS_URL: "redis://redis:6379/0"
      DATA_DIR: "/tmp/tradingai-data"
      # Read-only views of the two things that fail silently, so /api/system/
      # data-health can actually see them. Read-only is deliberate: the api must
      # never be able to corrupt the collector's unrecoverable data or the
      # backups it reports on.
      DOMINANCE_DATA_DIR: "/data/dominance"
      BACKUP_STATUS_DIR: "/data/backups"
      PYTHONPATH: "/app"
      # SECRET — the real value lives ONLY in the VPS copy of this file and is
      # deliberately not committed. Set it there; never here.
      API_AUTH_TOKEN: "__SET_ON_VPS_ONLY__"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # WHAT CODE TO RUN. A branch name is convenient and NOT reproducible:
      # recreate the container tomorrow and you get different code. Put a full
      # 40-character commit SHA here to pin a release — /api/system/version then
      # reports pinned:true, and rolling back is editing this one line.
      GIT_REF: "main"
      # ENGINE_BROKER: "sim"   # uncomment to run the prop-firm challenge sim
      #                        # (the Tier 2 vehicle). Unset = "paper".
    volumes:
      - /opt/dominance:/data/dominance:ro
      - /home/deploy/tradingai-backups:/data/backups:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        apt-get update -qq
        apt-get install -y --no-install-recommends git ca-certificates >/dev/null
        if [ ! -f /app/.ready ]; then
          rm -rf /tmp/src
          # fetch-by-ref rather than `clone --depth 1`: this accepts a branch, a
          # tag, OR a full commit SHA with the same three commands, so pinning a
          # release is a value change and not a rewrite. `clone --branch` cannot
          # take a SHA, which is why the old form could only ever float.
          git init -q /tmp/src
          git -C /tmp/src remote add origin https://github.com/Amineregayeg/tradingai.git
          git -C /tmp/src fetch -q --depth 1 origin "$${GIT_REF:-main}"
          git -C /tmp/src checkout -q FETCH_HEAD
          cp -a /tmp/src/backend/. /app/
          # Record what was ACTUALLY checked out, not what was asked for. Asking
          # for "main" and never recording which commit that resolved to is the
          # entire defect (KNOWN_ISSUES B3) — /api/system/version reads this file.
          git -C /tmp/src rev-parse HEAD > /app/.build-sha
          # SINGLE SOURCE OF TRUTH for versions. Do not inline pins here again.
          pip install --no-cache-dir -r /app/requirements-prod.txt
          touch /app/.ready
        fi
        python deploy_migrate.py
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Builds the frontend bundle, then exits. Not a server (D4).
  #
  # It is a separate service because building and serving want different images:
  # the build needs node and the repo, serving needs neither. Keeping node alive
  # to serve files is what produced the dev-server-in-production problem.
  web-build:
    image: node:20-slim
    working_dir: /app
    environment:
      # Keep in step with the api's GIT_REF. Recreating one container and not the
      # other is how the two halves end up on different commits — the specific
      # thing B3 says nobody could detect.
      GIT_REF: "main"
    volumes:
      - web_html:/srv
      - web_conf:/out/conf
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        apt-get update -qq
        apt-get install -y --no-install-recommends git ca-certificates >/dev/null
        rm -rf /tmp/src
        git init -q /tmp/src
        git -C /tmp/src remote add origin https://github.com/Amineregayeg/tradingai.git
        git -C /tmp/src fetch -q --depth 1 origin "$${GIT_REF:-main}"
        git -C /tmp/src checkout -q FETCH_HEAD
        sha=$$(git -C /tmp/src rev-parse HEAD)
        mkdir -p /srv /out/conf
        # The nginx config is refreshed every run. It is small, and it must track
        # the repo — a config that only updates when the bundle changes would
        # silently keep serving an old routing rule.
        # NOTE: nginx reads its config only at start, so a changed config needs
        # `docker compose restart web` to take effect.
        cp /tmp/src/deploy/nginx-web.conf /out/conf/default.conf
        # SKIP THE BUILD WHEN THE LIVE RELEASE ALREADY IS THIS COMMIT.
        # The original web service guarded on `[ ! -f /app/.ready ]`, which was
        # safe only because /app was container-local and died on recreate. These
        # are named volumes, where such a marker survives forever and no new
        # frontend would EVER deploy. Keying on the commit is self-correcting.
        # The index.html check matters too: without it a half-written release
        # whose marker happened to land would be skipped over and served broken.
        if [ "$$(readlink /srv/current 2>/dev/null)" = "rel-$$sha" ] \
           && [ -f /srv/current/index.html ]; then
          echo "frontend already live at $$sha — nothing to do"
          exit 0
        fi
        cp -a /tmp/src/frontend/. /app/
        corepack enable
        corepack prepare pnpm@9 --activate
        # --frozen-lockfile: the committed pnpm-lock.yaml is the source of truth
        # for frontend versions. Re-resolving here would let production run
        # packages CI never tested.
        pnpm install --frozen-lockfile
        pnpm build
        # BUILD INTO A NEW DIRECTORY, THEN FLIP A SYMLINK.
        # Nothing above this line touches what nginx is serving, so a build that
        # fails leaves the previous release running untouched (D8). The flip
        # itself is a rename, which the kernel performs atomically — no request
        # can observe a half-copied bundle.
        rm -rf /srv/rel-$$sha
        mkdir -p /srv/rel-$$sha
        cp -a dist/. /srv/rel-$$sha/
        echo "$$sha" > /srv/rel-$$sha/.build-sha
        ln -sfn rel-$$sha /srv/.next
        mv -Tf /srv/.next /srv/current
        # Keep the three most recent releases so a rollback has somewhere to go:
        #   ln -sfn rel-<older> /srv/.next && mv -Tf /srv/.next /srv/current
        ls -1dt /srv/rel-* 2>/dev/null | tail -n +4 | xargs -r rm -rf
        echo "frontend live at $$sha"
    restart: "no"

  web:
    image: nginx:alpine
    volumes:
      - web_html:/srv:ro
      - web_conf:/etc/nginx/conf.d:ro
    ports:
      - "8095:80"
    # WAITS FOR A BUNDLE — DOES NOT REQUIRE THE BUILD TO SUCCEED (D8).
    #
    # This used to be `depends_on: web-build: service_completed_successfully`,
    # which meant any failed build — a bad lockfile, a type error, an npm blip —
    # took the entire site down, even though the previous release was sitting
    # right there in the volume, intact and servable. A stale dashboard plus a
    # loud build failure beats a dark site.
    #
    # The wait still covers the opposite mistake: on a first-ever deploy there is
    # no release yet, and starting nginx then would serve a 404 site that looks
    # like data loss. So it blocks on a bundle EXISTING rather than on the latest
    # build having produced it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # The config is written by web-build too; without it nginx would fall
        # back to its stock config and serve the SPA with no /api proxy at all —
        # a site that looks up while every request fails.
        while [ ! -f /etc/nginx/conf.d/default.conf ] || [ ! -f /srv/current/index.html ]; do
          echo "waiting for a frontend bundle and config..."
          sleep 3
        done
        echo "serving release $$(readlink /srv/current)"
        exec nginx -g 'daemon off;'
    healthcheck:
      # Distinguishes "container is up" from "the site actually answers" — the
      # gap those two used to hide in.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/.build-sha"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  tradingai_db:
  web_html:
  web_conf:
