# BOOTSTRAP variant of compose.dominance.yaml — TEMPORARY, replace when possible.
#
# Deployed at: /home/deploy/tradingai-dominance/compose.yaml on 31.97.183.142
#     docker compose -p tradingai-dominance up -d
#
# WHY THIS EXISTS
# compose.dominance.yaml runs the collector by git-cloning the repo at container
# start, like every other service on this VPS. That requires the collector to be
# on GitHub `main`. At the time of deployment it was not: the code lived only on
# an unpushed local branch, and pushing was not authorized.
#
# The data, however, could not wait — intraday dominance history cannot be
# backfilled, so every day of delay is permanently unmeasurable. So this variant
# bind-mounts the script from the host instead of cloning it, which lets
# collection start today without touching the repo's publishing story.
#
# THE COST, STATED PLAINLY
# This puts a copy of application code on the VPS that the repo cannot see —
# precisely the pattern that let production drift onto numpy 2.2.6 while
# pyproject declared numpy<2.0.0. It is acceptable ONLY because it is small,
# recorded here, and temporary.
#
# HOW TO RETIRE IT (do this once the branch reaches GitHub main)
#     ssh pfe-vps 'cd ~/tradingai-dominance && docker compose -p tradingai-dominance down'
#     # copy deploy/compose.dominance.yaml to the VPS as compose.yaml
#     docker compose -p tradingai-dominance up -d
# The collected CSV lives in /opt/dominance on the host, NOT in the container,
# so swapping the compose file does not lose a single sample.

name: tradingai-dominance

services:
  collector:
    image: python:3.12-slim
    working_dir: /app
    environment:
      DOMINANCE_DIR: "/data"
      PYTHONUNBUFFERED: "1"
    volumes:
      # The script, read-only — the container has no business rewriting it.
      - /home/deploy/tradingai-dominance/app:/app:ro
      # The data, read-write. The pre-existing dominance-web project mounts this
      # same path read-only and serves it on :8097, so output is published with
      # no change to that service.
      - /opt/dominance:/data
    # Stdlib only: nothing to install, so the container is up in seconds and
    # cannot fail on dependency resolution.
    # 10s. THE NUMBER THAT DECIDES THIS IS 20, AND IT LIVES IN THE ENGINE.
    # These bars are RESAMPLED point observations, not exchange bars, so a bar carries
    # structure only if enough observations went into it.
    # `gate_008_roster.MIN_SAMPLES_PER_SYNTHETIC_BAR = 20` is the engine's declared
    # minimum, and `LayoutReadability` fails GATE-007 for any panel thinner than it.
    # The execution timeframe is 5M (MAGIC_STRATEGY_EXECUTION_PLAN.md §5.4), so the only
    # question this line answers is how many samples a 5-minute bar holds:
    #
    #     60s -> 5 samples   fails the minimum outright; sampling luck, not price action
    #     15s -> 20 samples  clears it with EXACTLY ZERO margin
    #     10s -> 30 samples  clears it with 50% headroom
    #
    # 15s is why this file said 15 before, and it is not enough — one missed or late poll
    # lands the bar on 19 and it is refused, and refresh_supplies() guarantees an overrun
    # twice a day (a hard 6-second sleep inside a normal tick, against a cadence controller
    # that never makes up a deficit).
    #
    # KEEP THIS IN STEP WITH deploy/compose.dominance.yaml. The cadence appears in both
    # files in DIFFERENT SYNTAX — a list here, `exec python …` there — so a grep for one
    # form silently misses the other, and a stale value here quietly reintroduces the old
    # cadence the next time the collector is bootstrapped from scratch.
    command: ["python", "collect_dominance.py", "--loop", "10"]
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - "python -c \"import sys,os,csv,datetime as dt;
           p='/data/dominance_intraday_raw.csv';
           sys.exit(1) if not os.path.exists(p) else None;
           rows=list(csv.DictReader(open(p)));
           sys.exit(1) if not rows else None;
           last=dt.datetime.fromisoformat(rows[-1]['ts_utc']);
           age=(dt.datetime.now(dt.timezone.utc)-last).total_seconds();
           sys.exit(0 if age < 600 else 1)\""
      interval: 5m
      timeout: 30s
      retries: 3
      start_period: 3m
