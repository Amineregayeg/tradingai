# Serves the BUILT frontend in production (KNOWN_ISSUES D4).
#
# It replaced `pnpm dev` — the Vite DEV server — which was serving the real site:
# unminified, source maps exposed, an HMR websocket open to the world, and every
# module shipped as a separate request.
#
# Three things the dev server was doing for free, which a static server does not.
# Each is silent when missed, which is what makes them worth naming:
#
#   1. PROXYING /api. The app calls relative paths (`const BASE = '/api'`), so
#      without a proxy every request 404s against the static root.
#   2. UPGRADING /ws. The dashboard's live feed is a WebSocket. Proxying it as
#      plain HTTP does not error — it just never connects, and the charts sit
#      there looking merely quiet.
#   3. SPA FALLBACK. Client-side routes (/engine, /report) are not files. Without
#      the fallback they work when clicked and 404 on refresh or deep link.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard posts screenshots; the default 1m is too small for those.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # WHY THE UPSTREAM IS A VARIABLE, NOT A LITERAL.
    # With `proxy_pass http://api:8000` nginx resolves the name ONCE at startup
    # and caches the address forever. Every deploy recreates the api container,
    # which usually gives it a new IP — so the frontend would start 502ing after
    # a routine backend deploy and stay broken until someone thought to restart
    # nginx too. A variable forces re-resolution through Docker's embedded DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Some analysis endpoints are genuinely slow; the default 60s cuts them off.
        proxy_read_timeout 120s;
    }

    location /ws {
        set $ws_upstream http://api:8000;
        proxy_pass $ws_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        # A live feed is idle between ticks. The default 60s read timeout would
        # drop a working connection during any quiet spell.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite content-hashes these filenames, so a changed file is a changed URL and
    # caching hard is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached. It is the file that names the hashed
    # bundles, so a cached copy keeps clients pointed at assets that no longer
    # exist — a deploy that looks fine to everyone except returning visitors.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Which commit built this bundle (B3). Deliberately uncached, so it answers
    # for the CURRENT deploy rather than whatever the browser saw last.
    location = /.build-sha {
        add_header Cache-Control "no-store";
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
